<div class="jukebox-section">
  <div class="volume-row">試聴音量：<input [(ngModel)]="auditionVolume" type="range" min="0" max="1" step="0.01" /></div>
  <div class="volume-row">BGM音量：<input [(ngModel)]="volume" type="range" min="0" max="1" step="0.01" /></div>
  <hr/>
  <div class="volume-row">全体音量：<input [(ngModel)]="roomVolume" type="range" min="0" max="2" step="0.01" disabled={{!roomVolumeChange}}/><br>
    <font style="font-size: 12px;">※全プレイヤー共通 GM制御用：変更を有効にする<input type="checkbox" id="roomVolumeChange" value="roomVolumeChange" [(ngModel)]="roomVolumeChange"></font>
  </div>
</div>

<hr/>

<!-- Folder System -->
<div class="jukebox-section">
  <div class="section-header">
    <b>フォルダ</b>
    <div class="folder-add-row">
      <input class="is-caret" [(ngModel)]="editingFolderName" placeholder="フォルダ名" style="width:8em;">
      <button (click)="addFolder()">追加</button>
    </div>
  </div>
  <div class="folder-tabs">
    <button *ngFor="let folder of getFolders()" [class.active]="selectedFolder === folder || (!selectedFolder && folder === 'すべて')"
      (click)="selectedFolder = folder === 'すべて' ? '' : folder">{{folder}}</button>
    <button *ngIf="selectedFolder && selectedFolder !== 'すべて'" class="danger" (click)="removeFolder(selectedFolder)">削除</button>
  </div>
</div>

<hr/>

<!-- Audio List -->
<div class="jukebox-section">
  <div *ngFor="let audio of getFilteredAudios()" class="audio-row">
    <div class="audio-controls">
      <button *ngIf="audio !== auditionPlayer?.audio || auditionPlayer?.paused" (click)="play(audio)" [disabled]="!audio.isReady">試聴</button>
      <button *ngIf="audio === auditionPlayer?.audio && !auditionPlayer?.paused" (click)="stop()" [disabled]="!audio.isReady">停止</button>
      <button *ngIf="audio !== jukebox?.audio" (click)="playBGM(audio)" [disabled]="!audio.isReady">BGM</button>
      <button *ngIf="audio === jukebox?.audio" (click)="stopBGM(audio)" [disabled]="!audio.isReady">■BGM</button>
      <button (click)="playOnce(audio)" [disabled]="!audio.isReady" title="1回だけ再生">SE</button>
      <button *ngIf="audio === sePlayer?.audio && !sePlayer?.paused" (click)="stopSE()">■SE</button>
      <button *ngIf="audio !== ambientPlayer?.audio || ambientPlayer?.paused" (click)="playAmbient(audio)" [disabled]="!audio.isReady" title="ループ再生">環境音</button>
      <button *ngIf="audio === ambientPlayer?.audio && !ambientPlayer?.paused" (click)="stopAmbient()">■環境</button>
    </div>
    <div class="audio-info">
      <span *ngIf="audio === auditionPlayer?.audio && !auditionPlayer?.paused" class="badge">試聴中</span>
      <span *ngIf="audio === jukebox?.audio" class="badge bgm-badge">BGM</span>
      <span *ngIf="audio === ambientPlayer?.audio && !ambientPlayer?.paused" class="badge ambient-badge">環境音</span>
      <span class="audio-name">{{audio.name}}</span>
    </div>
    <div class="audio-folder-assign">
      <select [ngModel]="getAudioFolder(audio.identifier)" (ngModelChange)="setAudioFolder(audio.identifier, $event)">
        <option value="">--</option>
        <ng-container *ngFor="let f of getFolders()">
          <option *ngIf="f !== 'すべて'" [value]="f">{{f}}</option>
        </ng-container>
      </select>
    </div>
  </div>
  <div *ngIf="audios.length < 1">アップロードされた音楽ファイルはここに表示されます。</div>
</div>

<hr/>

<button (click)="openCutInList()">カットイン編集</button>

<label>
  <div class="drop-zone">
    <div><i class="material-icons large-font">playlist_add</i></div>
    <div>ここに音楽をドロップ</div>
    <div class="small-font">またはここをクリックして選択</div>
    <input type="file" style="display: none;" (change)="handleFileSelect($event)" multiple accept="audio/*"/>
    <div class="small-font"><br>１ファイルにつき10MBまで</div>
  </div>
</label>
<div style="font-size: 12px;">※「試聴」は自分だけ。「BGM」は全員でループ。「SE」は全員で1回再生。「環境音」は自分だけループ。</div>
<div style="font-size: 12px;">※音楽ファイルはセーブデータに含まれません。</div>
