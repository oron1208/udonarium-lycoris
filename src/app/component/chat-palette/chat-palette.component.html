<div class="flex-container" #root>
  <div style="flex-grow: 0;">
    <form>
      <div class="chat-tab">
        @for (chatTab of chatMessageService.chatTabs; track chatTab) {
          <label>
            <input name="chat-tab" type="radio" value="{{chatTab.identifier}}" ng-control="options" [(ngModel)]="chatTabidentifier">
            <div>{{chatTab.name}}@if (chatTab.hasUnread) {
              <badge class="badge" [count]="chatTab.unreadLength"></badge>
            }</div>
          </label>
        }
        <button type="button" class="tab-setting small-font palette-window-btn" (click)="openPaletteWindow()" title="チャパレを別ウィンドウで開く（メインのパネルは最小化します）">⧉<i class="material-icons small-font">open_in_new</i></button>
      </div>
    </form><!---->
    <chat-input class="is-caret"
      [onlyCharacters]="true"
      [chatTabidentifier]="chatTabidentifier"
      [(gameType)]="gameType"
      [(sendFrom)]="sendFrom"
      [autoCompleteIndex]="completeIndex()"
      [autoCompleteListLen]="autoCompleteList().length"
      [(text)]="text"
      (chat)="sendChat($event)"
      (autoCompleteSwitch)="autoCompleteSwitchRelative($event)"
      (autoCompleteDo)="autoCompleteDoRelative($event)"
    (tabSwitch)="chatTabSwitchRelative($event)" #chatInput></chat-input>
    <div style="position:absolute;margin-top:-2em;">
      <button class="tab-setting small-font" (click)="indexBtn()">＜<i class="material-icons small-font">bookmarks</i></button>
    </div>
    <div class="complete-box">
      @if ((autoCompleteList().length == 1 && autoCompleteList()[0] != text) || autoCompleteList().length > 1) {
        <select class="complete" id="{{_timeId}}_complete"  style="overflow-y: auto;" size="5" (input)="selectAutoComplete(text,$event.target.value)" (click)="selectAutoComplete(text,$event.target.value)">
          @for (palette of autoCompleteList(); track palette) {
            <option value="{{palette}}">{{palette}}</option>
          }
        </select>
      }
    </div>
  </div>
  <div style="flex-grow: 1; height: 0; min-height: 100px;">
    <palette-browser [palette]="palette" (chooseLine)="selectPalette($event)" (sendLine)="sendPaletteCommand($event)" #paletteBrowser></palette-browser>
  </div>
</div>
