<!-- type=submit + モーダルcloseの組合せは、フォーム既定送信→beforeunloadダイアログ→ページ離脱を引き起こす。
     送信は常に防止し、入室は(click)/(keydown.enter)の明示ハンドラのみで行う。 -->
<form #passwordForm="ngForm" (submit)="$event.preventDefault()">
  <div>パスワード: <input class="is-caret" [(ngModel)]="password" (input)="onInputChange($event.target.value)" (keydown.enter)="submit()" [ngModelOptions]="{standalone: true}" placeholder="パスワード"  #passwordInput/></div>
  <button type="button" (click)="submit()">入室</button>
</form>
<div>
  <span style="font-size: 12px;">{{help}}</span>
</div>
