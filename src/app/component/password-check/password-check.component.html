<!-- クリック/Enterはフォーム送信に統一し、submit内で既定動作を止めてからモーダルを閉じる。
     keydown中に閉じるとsubmitリスナーが消え、その後の暗黙送信でページ離脱してしまう。 -->
<form (submit)="submit($event)">
  <div>パスワード: <input class="is-caret" [(ngModel)]="password" (input)="onInputChange($event.target.value)" [ngModelOptions]="{standalone: true}" placeholder="パスワード"  #passwordInput/></div>
  <button type="submit">入室</button>
</form>
<div>
  <span style="font-size: 12px;">{{help}}</span>
</div>
