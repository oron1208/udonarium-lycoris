<div class="lighting-layer" [class.on]="state.enabled" [class.night]="state.nightMode" [class.pa]="state.paMode" [ngStyle]="overlayStyle">
  <canvas #lightCanvas class="light-canvas"></canvas>
  @if (state.enabled && state.haze) {
    <div class="lighting-haze"></div>
  }

  @if (state.enabled && state.spotlights) {
    <div class="spotlight-field">
      @for (slot of spotlightSlots; track slot) {
        <div class="spotlight" [class.s2]="slot === 1" [class.s3]="slot === 2" [class.s4]="slot === 3"></div>
      }
    </div>
  }

  @if (state.enabled && state.lasers) {
    <div class="laser-field">
      <div class="laser l1"></div>
      <div class="laser l2"></div>
      <div class="laser l3"></div>
      <div class="laser l4"></div>
    </div>
  }

  @if (state.enabled && state.flames) {
    <div class="flame-field">
      <div class="flame f1"></div>
      <div class="flame f2"></div>
      <div class="flame f3"></div>
      <div class="flame f4"></div>
    </div>
  }
</div>
