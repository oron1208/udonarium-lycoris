<div class="dict-picker">
  <div class="picker-list">
    @for (d of dicts; track d) {
      <label class="picker-row">
        <input type="radio" name="dictPickerRadio" [value]="d.id" [(ngModel)]="selectedId" [ngModelOptions]="{standalone: true}">
        <span class="picker-name">{{d.name}}</span>
        <span class="picker-count">{{countOf(d)}}件</span>
      </label>
    }
  </div>
  @if (dicts.length < 1) {
    <div class="picker-empty">コマ辞書が無いよ。先に辞書パネルで作ってね。</div>
  }
  @if (message) {
    <div class="picker-message">{{message}}</div>
  }
  <div class="picker-actions">
    <button type="button" (click)="cancel()">キャンセル</button>
    <button type="button" class="picker-ok" [attr.disabled]="!selectedId || busy ? '' : null" (click)="register()">登録</button>
  </div>
</div>
